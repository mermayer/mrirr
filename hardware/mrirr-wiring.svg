<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
  <title id="title">Minimal Roon IR Remote wiring reference</title>
  <desc id="desc">Corrected front view of the ESP32-S3 with the MRIRR display, DAC, IR receiver, status display and PCF8574T button connections.</desc>
  <defs>
    <style>
      .page { fill: #f5faf8; }
      .frame { fill: #fffefd; stroke: #cfe3e1; stroke-width: 3; }
      .panel { fill: #ffffff; stroke: #c9dcdf; stroke-width: 3; }
      .panel-soft { fill: #eef9f7; stroke: #74c5bb; stroke-width: 3; }
      .board { fill: #13242b; stroke: #07161b; stroke-width: 4; }
      .usb { fill: #d9dee1; stroke: #89979d; stroke-width: 3; }
      .summary { fill: #eaf6f4; stroke: #c9e3df; stroke-width: 2; }
      .title { font: 700 48px Arial, sans-serif; fill: #153e49; }
      .subtitle { font: 400 24px Arial, sans-serif; fill: #718b94; }
      .h2 { font: 700 31px Arial, sans-serif; fill: #173e49; }
      .small { font: 400 20px Arial, sans-serif; fill: #718b94; }
      .label { font: 700 21px Arial, sans-serif; fill: #263f48; }
      .value { font: 600 21px Arial, sans-serif; fill: #728b95; }
      .note { font: 600 20px Arial, sans-serif; fill: #274752; }
      .board-title { font: 700 48px Arial, sans-serif; fill: #f7fbfa; }
      .board-small { font: 500 17px Arial, sans-serif; fill: #92a9b0; }
      .pin-label { font: 700 19px Arial, sans-serif; fill: #f3f8f7; }
      .pin-function { font: 500 15px Arial, sans-serif; fill: #8da7ae; }
      .rail-power { fill: none; stroke: #e65e5b; stroke-width: 6; stroke-linecap: round; }
      .rail-ground { fill: none; stroke: #2d3a40; stroke-width: 6; stroke-linecap: round; }
      .pin { fill: #f5eed4; stroke: #927f4b; stroke-width: 3; }
      .pin-use { fill: #ffe7a8; stroke: #dc9819; stroke-width: 4; }
      .pin-power { fill: #ffe2df; stroke: #db5f5b; stroke-width: 4; }
      .pin-ground { fill: #e4e9ea; stroke: #344147; stroke-width: 4; }
      .dot-red { fill: #e65e5b; }
      .dot-black { fill: #303d43; }
      .dot-green { fill: #24a87d; }
      .dot-blue { fill: #3f7fd9; }
      .dot-yellow { fill: #d8a016; }
      .dot-purple { fill: #8266ca; }
      .dot-orange { fill: #ea8b38; }
      .dot-teal { fill: #229da6; }
      .dot-pink { fill: #d76aa6; }
    </style>
  </defs>

  <rect class="page" width="2400" height="1600"/>
  <rect class="frame" x="35" y="30" width="2330" height="1525" rx="28"/>

  <text class="title" x="90" y="92">Minimal Roon IR Remote - ESP-IDF Wiring Reference</text>
  <text class="subtitle" x="92" y="132">Corrected ESP32-S3 front view. This is a wiring reference, not a PCB layout.</text>
  <text class="note" x="90" y="171" fill="#d45753">3.3 V POWER RAIL - ALL MODULES</text>
  <path class="rail-power" d="M 90 190 H 2310"/>

  <!-- Left: PCF8574T -->
  <rect class="panel" x="70" y="220" width="750" height="490" rx="18"/>
  <text class="h2" x="105" y="270">PCF8574T - ENCLOSURE BUTTONS</text>
  <text class="small" x="105" y="304">All six buttons connect to the expander, not directly to the ESP32-S3.</text>

  <rect class="panel-soft" x="105" y="340" width="250" height="145" rx="14"/>
  <text x="230" y="427" text-anchor="middle" style="font:700 31px Arial,sans-serif;fill:#1e968d">PCF8574T</text>

  <circle class="dot-red" cx="405" cy="347" r="7"/><text class="label" x="430" y="355">VCC</text><text class="value" x="635" y="355">3.3 V</text>
  <circle class="dot-black" cx="405" cy="392" r="7"/><text class="label" x="430" y="400">GND</text><text class="value" x="635" y="400">GND</text>
  <circle class="dot-teal" cx="405" cy="437" r="7"/><text class="label" x="430" y="445">SDA</text><text class="value" x="635" y="445">ESP GPIO 1</text>
  <circle class="dot-purple" cx="405" cy="482" r="7"/><text class="label" x="430" y="490">SCL</text><text class="value" x="635" y="490">ESP GPIO 2</text>
  <circle class="dot-orange" cx="405" cy="527" r="7"/><text class="label" x="430" y="535">INT</text><text class="value" x="635" y="535">ESP GPIO 16</text>

  <text class="note" x="105" y="574">BUTTON TO GND, PRESSED = LOW</text>
  <circle class="dot-teal" cx="115" cy="615" r="6"/><text class="label" x="135" y="622">P0</text><text class="value" x="190" y="622">Button 1</text>
  <circle class="dot-teal" cx="365" cy="615" r="6"/><text class="label" x="385" y="622">P1</text><text class="value" x="440" y="622">Button 2</text>
  <circle class="dot-teal" cx="615" cy="615" r="6"/><text class="label" x="635" y="622">P2</text><text class="value" x="690" y="622">Button 3</text>
  <circle class="dot-teal" cx="115" cy="663" r="6"/><text class="label" x="135" y="670">P3</text><text class="value" x="190" y="670">Button 4</text>
  <circle class="dot-teal" cx="365" cy="663" r="6"/><text class="label" x="385" y="670">P4</text><text class="value" x="440" y="670">Button 5</text>
  <circle class="dot-teal" cx="615" cy="663" r="6"/><text class="label" x="635" y="670">P5</text><text class="value" x="690" y="670">Button 6</text>

  <!-- Left: power -->
  <rect class="panel" x="70" y="745" width="750" height="270" rx="18"/>
  <text class="h2" x="105" y="797">POWER</text>
  <text class="small" x="105" y="830">All modules use the same 3.3 V supply and common ground.</text>
  <circle class="dot-red" cx="115" cy="868" r="7"/><text class="label" x="140" y="876">3.3 V</text><text class="value" x="300" y="876">IR, TM1637, GC9A01, PCF8574T</text>
  <circle class="dot-red" cx="115" cy="910" r="7"/><text class="label" x="140" y="918">PCM5102 VIN</text><text class="value" x="335" y="918">3.3 V</text>
  <circle class="dot-black" cx="115" cy="952" r="7"/><text class="label" x="140" y="960">GND</text><text class="value" x="300" y="960">All modules and button ground</text>
  <text class="note" x="140" y="994">I2C pull-ups must be connected to 3.3 V only.</text>

  <!-- Left: orientation -->
  <rect class="panel" x="70" y="1025" width="750" height="300" rx="18"/>
  <text class="h2" x="105" y="1077">BOARD ORIENTATION</text>
  <text class="small" x="105" y="1110">Component side facing the viewer, USB connector at the top.</text>
  <text class="note" x="105" y="1158">Use the printed pin names, not sequential header numbers.</text>
  <text class="label" x="105" y="1205">Upper left:</text><text class="value" x="270" y="1205">two GND pins</text>
  <text class="label" x="105" y="1250">Lower right:</text><text class="value" x="270" y="1250">two 3.3 V pins</text>
  <text class="small" x="105" y="1295">The two header rows are shown in the corrected front-view order.</text>

  <!-- Center: ESP32-S3 -->
  <rect class="board" x="940" y="220" width="520" height="1120" rx="42"/>
  <rect class="usb" x="1040" y="140" width="320" height="82" rx="13"/>
  <text class="label" x="1200" y="191" text-anchor="middle">USB-C</text>
  <text class="board-small" x="1200" y="252" text-anchor="middle">CORRECTED FRONT VIEW</text>
  <g transform="translate(1200 790) rotate(-90)">
    <text class="board-title" text-anchor="middle">ESP32-S3</text>
  </g>

  <!-- Left pin row -->
  <g>
    <circle class="pin-ground" cx="940" cy="280" r="16"/><text class="pin-label" x="975" y="287">GND</text>
    <circle class="pin-ground" cx="940" cy="329" r="16"/><text class="pin-label" x="975" y="336">GND</text>
    <circle class="pin" cx="940" cy="378" r="16"/><text class="pin-label" x="975" y="385">19</text>
    <circle class="pin" cx="940" cy="427" r="16"/><text class="pin-label" x="975" y="434">20</text>
    <circle class="pin" cx="940" cy="476" r="16"/><text class="pin-label" x="975" y="483">21</text>
    <circle class="pin" cx="940" cy="525" r="16"/><text class="pin-label" x="975" y="532">47</text>
    <circle class="pin" cx="940" cy="574" r="16"/><text class="pin-label" x="975" y="581">48</text>
    <circle class="pin" cx="940" cy="623" r="16"/><text class="pin-label" x="975" y="630">45</text>
    <circle class="pin" cx="940" cy="672" r="16"/><text class="pin-label" x="975" y="679">0</text>
    <circle class="pin" cx="940" cy="721" r="16"/><text class="pin-label" x="975" y="728">35</text>
    <circle class="pin" cx="940" cy="770" r="16"/><text class="pin-label" x="975" y="777">36</text>
    <circle class="pin" cx="940" cy="819" r="16"/><text class="pin-label" x="975" y="826">37</text>
    <circle class="pin" cx="940" cy="868" r="16"/><text class="pin-label" x="975" y="875">38</text>
    <circle class="pin" cx="940" cy="917" r="16"/><text class="pin-label" x="975" y="924">39</text>
    <circle class="pin" cx="940" cy="966" r="16"/><text class="pin-label" x="975" y="973">40</text>
    <circle class="pin" cx="940" cy="1015" r="16"/><text class="pin-label" x="975" y="1022">41</text>
    <circle class="pin" cx="940" cy="1064" r="16"/><text class="pin-label" x="975" y="1071">42</text>
    <circle class="pin-use" cx="940" cy="1113" r="16"/><text class="pin-label" x="975" y="1120">2</text><text class="pin-function" x="1030" y="1119">PCF SCL</text>
    <circle class="pin-use" cx="940" cy="1162" r="16"/><text class="pin-label" x="975" y="1169">1</text><text class="pin-function" x="1030" y="1168">PCF SDA</text>
    <circle class="pin" cx="940" cy="1211" r="16"/><text class="pin-label" x="975" y="1218">RX</text>
    <circle class="pin" cx="940" cy="1260" r="16"/><text class="pin-label" x="975" y="1267">TX</text>
    <circle class="pin-ground" cx="940" cy="1309" r="16"/><text class="pin-label" x="975" y="1316">GND</text>
  </g>

  <!-- Right pin row -->
  <g>
    <circle class="pin-ground" cx="1460" cy="280" r="16"/><text class="pin-label" x="1425" y="287" text-anchor="end">GND</text>
    <circle class="pin" cx="1460" cy="329" r="16"/><text class="pin-label" x="1425" y="336" text-anchor="end">5VIN</text>
    <circle class="pin-use" cx="1460" cy="378" r="16"/><text class="pin-label" x="1425" y="385" text-anchor="end">14</text><text class="pin-function" x="1368" y="384" text-anchor="end">GC RST</text>
    <circle class="pin-use" cx="1460" cy="427" r="16"/><text class="pin-label" x="1425" y="434" text-anchor="end">13</text><text class="pin-function" x="1368" y="433" text-anchor="end">I2S DIN</text>
    <circle class="pin-use" cx="1460" cy="476" r="16"/><text class="pin-label" x="1425" y="483" text-anchor="end">12</text><text class="pin-function" x="1368" y="482" text-anchor="end">I2S WS</text>
    <circle class="pin-use" cx="1460" cy="525" r="16"/><text class="pin-label" x="1425" y="532" text-anchor="end">11</text><text class="pin-function" x="1368" y="531" text-anchor="end">I2S BCK</text>
    <circle class="pin-use" cx="1460" cy="574" r="16"/><text class="pin-label" x="1425" y="581" text-anchor="end">10</text><text class="pin-function" x="1368" y="580" text-anchor="end">GC DC</text>
    <circle class="pin-use" cx="1460" cy="623" r="16"/><text class="pin-label" x="1425" y="630" text-anchor="end">9</text><text class="pin-function" x="1368" y="629" text-anchor="end">GC CS</text>
    <circle class="pin" cx="1460" cy="672" r="16"/><text class="pin-label" x="1425" y="679" text-anchor="end">46</text>
    <circle class="pin" cx="1460" cy="721" r="16"/><text class="pin-label" x="1425" y="728" text-anchor="end">3</text>
    <circle class="pin-use" cx="1460" cy="770" r="16"/><text class="pin-label" x="1425" y="777" text-anchor="end">8</text><text class="pin-function" x="1368" y="776" text-anchor="end">GC SDA</text>
    <circle class="pin" cx="1460" cy="819" r="16"/><text class="pin-label" x="1425" y="826" text-anchor="end">18</text>
    <circle class="pin" cx="1460" cy="868" r="16"/><text class="pin-label" x="1425" y="875" text-anchor="end">17</text>
    <circle class="pin-use" cx="1460" cy="917" r="16"/><text class="pin-label" x="1425" y="924" text-anchor="end">16</text><text class="pin-function" x="1368" y="923" text-anchor="end">PCF INT</text>
    <circle class="pin" cx="1460" cy="966" r="16"/><text class="pin-label" x="1425" y="973" text-anchor="end">15</text>
    <circle class="pin-use" cx="1460" cy="1015" r="16"/><text class="pin-label" x="1425" y="1022" text-anchor="end">7</text><text class="pin-function" x="1368" y="1021" text-anchor="end">GC CLK</text>
    <circle class="pin-use" cx="1460" cy="1064" r="16"/><text class="pin-label" x="1425" y="1071" text-anchor="end">6</text><text class="pin-function" x="1368" y="1070" text-anchor="end">TM DIO</text>
    <circle class="pin-use" cx="1460" cy="1113" r="16"/><text class="pin-label" x="1425" y="1120" text-anchor="end">5</text><text class="pin-function" x="1368" y="1119" text-anchor="end">TM CLK</text>
    <circle class="pin-use" cx="1460" cy="1162" r="16"/><text class="pin-label" x="1425" y="1169" text-anchor="end">4</text><text class="pin-function" x="1368" y="1168" text-anchor="end">IR OUT</text>
    <circle class="pin" cx="1460" cy="1211" r="16"/><text class="pin-label" x="1425" y="1218" text-anchor="end">RST</text>
    <circle class="pin-power" cx="1460" cy="1260" r="16"/><text class="pin-label" x="1425" y="1267" text-anchor="end">3V3</text>
    <circle class="pin-power" cx="1460" cy="1309" r="16"/><text class="pin-label" x="1425" y="1316" text-anchor="end">3V3</text>
  </g>

  <!-- Right: IR receiver -->
  <rect class="panel" x="1580" y="220" width="750" height="225" rx="18"/>
  <text class="h2" x="1615" y="270">IR RECEIVER</text>
  <text class="small" x="1615" y="304">Module pin OUT, DATA or S connects to GPIO 4.</text>
  <circle class="dot-red" cx="1625" cy="342" r="7"/><text class="label" x="1650" y="350">VCC</text><text class="value" x="1900" y="350">3.3 V</text>
  <circle class="dot-black" cx="1625" cy="382" r="7"/><text class="label" x="1650" y="390">GND</text><text class="value" x="1900" y="390">GND</text>
  <circle class="dot-green" cx="1625" cy="422" r="7"/><text class="label" x="1650" y="430">OUT / DATA / S</text><text class="value" x="1900" y="430">ESP GPIO 4</text>

  <!-- Right: TM1637 -->
  <rect class="panel" x="1580" y="475" width="750" height="270" rx="18"/>
  <text class="h2" x="1615" y="525">TM1637 STATUS DISPLAY</text>
  <text class="small" x="1615" y="559">Four-digit status display for boot, network, Roon and IR learning.</text>
  <circle class="dot-red" cx="1625" cy="599" r="7"/><text class="label" x="1650" y="607">VCC</text><text class="value" x="1900" y="607">3.3 V</text>
  <circle class="dot-black" cx="1625" cy="639" r="7"/><text class="label" x="1650" y="647">GND</text><text class="value" x="1900" y="647">GND</text>
  <circle class="dot-blue" cx="1625" cy="679" r="7"/><text class="label" x="1650" y="687">CLK</text><text class="value" x="1900" y="687">ESP GPIO 5</text>
  <circle class="dot-yellow" cx="1625" cy="719" r="7"/><text class="label" x="1650" y="727">DIO</text><text class="value" x="1900" y="727">ESP GPIO 6</text>

  <!-- Right: GC9A01 -->
  <rect class="panel" x="1580" y="775" width="750" height="355" rx="18"/>
  <text class="h2" x="1615" y="825">GC9A01 ROUND TFT</text>
  <text class="small" x="1615" y="859">240 x 240 SPI module with seven pins and no separate backlight pin.</text>
  <circle class="dot-red" cx="1625" cy="899" r="7"/><text class="label" x="1650" y="907">VCC</text><text class="value" x="1900" y="907">3.3 V</text>
  <circle class="dot-black" cx="1625" cy="939" r="7"/><text class="label" x="1650" y="947">GND</text><text class="value" x="1900" y="947">GND</text>
  <circle class="dot-purple" cx="1625" cy="979" r="7"/><text class="label" x="1650" y="987">SCL / CLK</text><text class="value" x="1900" y="987">ESP GPIO 7</text>
  <circle class="dot-orange" cx="1625" cy="1019" r="7"/><text class="label" x="1650" y="1027">SDA / DIN</text><text class="value" x="1900" y="1027">ESP GPIO 8</text>
  <circle class="dot-teal" cx="1625" cy="1059" r="7"/><text class="label" x="1650" y="1067">CS</text><text class="value" x="1900" y="1067">ESP GPIO 9</text>
  <circle class="dot-pink" cx="1625" cy="1099" r="7"/><text class="label" x="1650" y="1107">DC</text><text class="value" x="1900" y="1107">ESP GPIO 10</text>
  <circle class="dot-blue" cx="2050" cy="899" r="7"/><text class="label" x="2075" y="907">RST / RES</text><text class="value" x="2225" y="907">GPIO 14</text>
  <circle cx="2190" cy="1018" r="66" fill="#13242b"/><circle cx="2190" cy="1018" r="40" fill="#f5bed4"/>
  <text class="small" x="2190" y="1100" text-anchor="middle">240 x 240</text>

  <!-- Right: PCM5102 -->
  <rect class="panel" x="1580" y="1160" width="750" height="195" rx="18"/>
  <text class="h2" x="1615" y="1207">PCM5102 DAC</text>
  <text class="small" x="1615" y="1239">I2S audio output from Squeezelite</text>
  <circle class="dot-red" cx="1625" cy="1274" r="6"/><text class="label" x="1645" y="1281">VIN</text><text class="value" x="1710" y="1281">3.3 V</text>
  <circle class="dot-black" cx="1625" cy="1317" r="6"/><text class="label" x="1645" y="1324">GND</text><text class="value" x="1710" y="1324">GND</text>
  <circle class="dot-blue" cx="1840" cy="1274" r="6"/><text class="label" x="1860" y="1281">BCK</text><text class="value" x="1920" y="1281">GPIO 11</text>
  <circle class="dot-green" cx="1840" cy="1317" r="6"/><text class="label" x="1860" y="1324">LCK / WS</text><text class="value" x="1970" y="1324">GPIO 12</text>
  <circle class="dot-yellow" cx="2090" cy="1274" r="6"/><text class="label" x="2110" y="1281">DIN</text><text class="value" x="2170" y="1281">GPIO 13</text>
  <text class="small" x="2090" y="1324">SCK bridge to GND</text>

  <!-- Summary and ground -->
  <rect class="summary" x="70" y="1390" width="2260" height="105" rx="16"/>
  <text class="note" x="105" y="1434">REFERENCE PIN MAP</text>
  <text class="label" x="105" y="1473">IR GPIO 4   |   TM1637 GPIO 5 / 6   |   GC9A01 GPIO 7 / 8 / 9 / 10 / 14   |   PCM5102 GPIO 11 / 12 / 13   |   PCF8574T I2C GPIO 1 / 2, INT GPIO 16</text>
  <text class="small" x="90" y="1532">COMMON GROUND RAIL - ALL MODULES AND BUTTONS</text>
  <path class="rail-ground" d="M 90 1550 H 2310"/>
</svg>
